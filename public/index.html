<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MediaHub 防丢失媒体分享网站，多线路互备，稳定访问电影等媒体资源。">
  <meta name="theme-color" content="#06070a">
  <meta property="og:title" content="MediaHub 防丢失媒体分享网站">
  <meta property="og:description" content="多线路互备，收藏本站防止丢失。">
  <meta property="og:type" content="website">
  <title>MediaHub · 防丢失媒体站</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== 深色电影质感 · 全重构视觉 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #040609;
      --ink: #f1ede4;
      --mute: #9a9487;
      --gold: #c9a227;
      --gold-bright: #e8c547;
      --gold-soft: rgba(201, 162, 39, 0.18);
      --teal: #4a7d8c;
      --teal-dim: rgba(74, 125, 140, 0.25);
      --line-subtle: rgba(243, 238, 228, 0.10);
      --ease-prime: cubic-bezier(0.23, 1, 0.32, 1);
      --shadow-card: 0 20px 40px -16px rgba(0,0,0,0.8);
    }

    html, body {
      min-height: 100%;
      background: var(--bg-deep);
    }

    body {
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: clamp(1.2rem, 4vw, 2.8rem);
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 35% at 20% 10%, rgba(201, 162, 39, 0.08), transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 85%, rgba(74, 125, 140, 0.12), transparent 50%),
        radial-gradient(ellipse 45% 25% at 5% 70%, rgba(120, 48, 36, 0.08), transparent 45%),
        linear-gradient(145deg, #0b0e14 0%, #040609 70%, #020305 100%);
      background-attachment: fixed;
    }

    /* ——— 颗粒质感 & 光晕 ——— */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.35'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    /* ——— 胶片齿孔导轨 (升级) ——— */
    .rails {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.10;
    }

    .rails span {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20px;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 14px,
        rgba(241, 237, 228, 0.8) 14px 22px,
        transparent 22px 34px
      );
    }

    .rails span:first-child { left: clamp(0.5rem, 2.5vw, 1.8rem); }
    .rails span:last-child { right: clamp(0.5rem, 2.5vw, 1.8rem); }

    /* ——— 主容器 ——— */
    .shell {
      position: relative;
      z-index: 2;
      width: min(440px, 100%);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(1px);
    }

    /* ——— 品牌标识 ——— */
    .brand {
      font-family: "Syne", "Noto Sans SC", sans-serif;
      font-weight: 800;
      font-size: clamp(3.6rem, 13vw, 5rem);
      letter-spacing: -0.04em;
      line-height: 0.9;
      margin-bottom: 0.6rem;
      transform: translateY(0);
      animation: floatIn 0.8s var(--ease-prime) both;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.6));
    }

    .brand em {
      font-style: normal;
      background: linear-gradient(135deg, #f1ede4 20%, #e8c547 55%, #f1ede4 85%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 7s ease-in-out infinite alternate;
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(24px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ——— 装饰线 (光晕拉丝) ——— */
    .rule {
      width: 4.8rem;
      height: 2px;
      margin: 0 auto 1.2rem;
      background: linear-gradient(90deg, transparent, var(--gold-bright), var(--gold), var(--gold-bright), transparent);
      background-size: 200% 100%;
      border-radius: 4px;
      opacity: 0.7;
      animation: drawGlow 0.9s var(--ease-prime) 0.2s both, pulseLine 4s ease-in-out infinite alternate;
    }

    @keyframes drawGlow {
      0% { transform: scaleX(0); opacity: 0; }
      100% { transform: scaleX(1); opacity: 0.7; }
    }

    @keyframes pulseLine {
      0% { opacity: 0.4; filter: blur(0px); }
      100% { opacity: 0.9; filter: blur(0.5px); }
    }

    /* ——— 副标题 & 描述 ——— */
    .tagline {
      font-size: 0.9rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--mute);
      margin-bottom: 0.5rem;
      font-weight: 400;
      animation: fadeUp 0.8s var(--ease-prime) 0.15s both;
    }

    .lede {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--mute);
      max-width: 80%;
      margin: 0 auto 2.2rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      animation: fadeUp 0.8s var(--ease-prime) 0.25s both;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ——— 线路卡片 (全新质感) ——— */
    .routes {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      width: 100%;
      list-style: none;
      animation: fadeUp 0.8s var(--ease-prime) 0.35s both;
    }

    .routes a {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(243, 238, 228, 0.10);
      border-radius: 18px;
      backdrop-filter: blur(4px);
      box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transition: all 0.4s var(--ease-prime);
      isolation: isolate;
      overflow: hidden;
      transform: translateY(0);
    }

    /* 光效扫过 */
    .routes a::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(201, 162, 39, 0.08) 50%, transparent 70%);
      transform: translateX(-150%);
      transition: transform 0.7s var(--ease-prime);
      z-index: -1;
      border-radius: 18px;
    }

    .routes a:hover::before,
    .routes a:focus-visible::before {
      transform: translateX(150%);
    }

    .routes a::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      padding: 1px;
      background: conic-gradient(from 120deg at 50% 50%, transparent, var(--gold-soft), transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .routes a:hover::after,
    .routes a:focus-visible::after {
      opacity: 0.6;
    }

    .routes a:hover,
    .routes a:focus-visible {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(201, 162, 39, 0.35);
      background: rgba(201, 162, 39, 0.07);
      box-shadow: 0 24px 48px -20px rgba(0,0,0,0.9), 0 0 0 1px rgba(201, 162, 39, 0.15);
      outline: none;
    }

    .routes a:active {
      transform: translateY(-1px) scale(0.99);
    }

    /* 主线路高亮 */
    .primary {
      background: linear-gradient(145deg, rgba(201, 162, 39, 0.10), rgba(201, 162, 39, 0.02));
      border-color: rgba(201, 162, 39, 0.28);
      box-shadow: 0 0 30px -8px rgba(201, 162, 39, 0.08), var(--shadow-card);
    }

    .primary .route-name {
      color: var(--gold-bright);
    }

    .route-copy {
      text-align: left;
      min-width: 0;
    }

    .route-name {
      font-family: "Syne", "Noto Sans SC", sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
      margin-bottom: 0.1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .route-name::before {
      content: "◆";
      font-size: 0.55rem;
      color: var(--gold);
      opacity: 0.7;
      margin-right: 0.2rem;
    }

    .route-meta {
      font-size: 0.72rem;
      color: var(--mute);
      letter-spacing: 0.04em;
      font-weight: 400;
      opacity: 0.7;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .route-meta::before {
      content: "▸";
      color: var(--gold);
      opacity: 0.5;
      font-size: 0.6rem;
    }

    .route-go {
      font-family: "Syne", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--gold-bright);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.4rem 0.2rem 0.6rem;
      border-radius: 40px;
      background: rgba(201, 162, 39, 0.06);
      border: 1px solid rgba(201, 162, 39, 0.10);
      transition: all 0.4s var(--ease-prime);
      white-space: nowrap;
    }

    .routes a:hover .route-go,
    .routes a:focus-visible .route-go {
      gap: 0.7rem;
      background: rgba(201, 162, 39, 0.15);
      border-color: rgba(201, 162, 39, 0.3);
      box-shadow: 0 0 16px rgba(201, 162, 39, 0.05);
    }

    .route-go svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      transition: transform 0.3s;
    }

    .routes a:hover .route-go svg {
      transform: translateX(4px);
    }

    /* ——— 收藏按钮 ——— */
    .actions {
      margin-top: 2.2rem;
      animation: fadeUp 0.8s var(--ease-prime) 0.5s both;
    }

    .actions button {
      font-family: "Noto Sans SC", sans-serif;
      font-size: 0.85rem;
      font-weight: 450;
      letter-spacing: 0.06em;
      color: var(--mute);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid transparent;
      padding: 0.25rem 0.2rem;
      cursor: pointer;
      transition: all 0.3s var(--ease-prime);
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .actions button::before {
      content: "☆";
      font-size: 1rem;
      color: var(--gold);
      opacity: 0.4;
      transition: opacity 0.3s;
    }

    .actions button:hover,
    .actions button:focus-visible {
      color: var(--gold-bright);
      border-bottom-color: var(--gold);
      outline: none;
      transform: translateY(-2px);
    }

    .actions button:hover::before,
    .actions button:focus-visible::before {
      opacity: 1;
    }

    /* ——— 页脚 ——— */
    footer {
      margin-top: 3rem;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: rgba(138, 132, 120, 0.4);
      border-top: 1px solid rgba(255,255,255,0.03);
      padding-top: 1.6rem;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.8s var(--ease-prime) 0.6s both;
    }

    /* ——— 响应式微调 ——— */
    @media (max-width: 480px) {
      body {
        place-items: start center;
        padding: 2rem 1.2rem;
        padding-top: 10vh;
      }

      .rails { display: none; }

      .lede {
        max-width: 92%;
        font-size: 0.95rem;
      }

      .routes a {
        padding: 1rem 1.2rem;
        border-radius: 16px;
      }

      .route-name {
        font-size: 1rem;
      }

      .route-go {
        font-size: 0.65rem;
        padding: 0.1rem 0.3rem 0.1rem 0.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        transform: none !important;
      }
      body::before { opacity: 0.1; }
    }

    /* 微交互：光标跟踪光晕 (纯装饰) */
    .shell::after {
      content: "";
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(201, 162, 39, 0.03) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: all 0.2s;
    }
  </style>
</head>
<body>
  <div class="rails" aria-hidden="true"><span></span><span></span></div>

  <main class="shell">
    <h1 class="brand"><em>MediaHub</em></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tagline">防丢失 · 多线路互备</p>
    <p class="lede">任选线路进入电影站，收藏本站随时回来。</p>

    <ul class="routes" aria-label="访问线路">
      <li>
        <a class="primary" href="http://117.72.146.0/movies" target="_blank" rel="noopener noreferrer">
          <span class="route-copy">
            <span class="route-name">主线路 · 电影站</span>
            <span class="route-meta">117.72.146.0</span>
          </span>
          <span class="route-go">
            进入
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </li>
      <li>
        <a href="http://45.113.3.26/movies" target="_blank" rel="noopener noreferrer">
          <span class="route-copy">
            <span class="route-name">备用线路 · 电影站</span>
            <span class="route-meta">45.113.3.26</span>
          </span>
          <span class="route-go">
            进入
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </li>
    </ul>

    <div class="actions">
      <button type="button" id="bookmark-btn">收藏本站，防止丢失</button>
    </div>

    <footer>
      <p>&copy; 2026 MediaHub · 稳定访问</p>
    </footer>
  </main>

  <script>
    (function() {
      const btn = document.getElementById("bookmark-btn");
      if (!btn) return;

      const isMac = /Mac|iPhone|iPad|iPod/i.test(navigator.platform || navigator.userAgent);
      const tip = isMac
        ? "请按 ⌘ + D 将本页加入收藏夹"
        : "请按 Ctrl + D 将本页加入收藏夹";

      btn.addEventListener("click", function(e) {
        e.preventDefault();

        // Firefox / Safari (旧)
        if (window.sidebar && typeof window.sidebar.addPanel === "function") {
          window.sidebar.addPanel(document.title, window.location.href, "");
          return;
        }
        // IE / Edge (旧)
        if (window.external && "AddFavorite" in window.external) {
          try {
            window.external.AddFavorite(location.href, document.title);
            return;
          } catch (_) { /* fall through */ }
        }
        // 通用提示
        alert(tip);
      });

      // 增加键盘快捷键视觉提示 (可忽略)
      btn.addEventListener("focus", function() {
        this.style.borderBottomColor = "var(--gold)";
      });
      btn.addEventListener("blur", function() {
        this.style.borderBottomColor = "transparent";
      });
    })();
  </script>
</body>
</html>
