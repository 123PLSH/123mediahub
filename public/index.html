<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MediaHub 防丢失媒体分享网站，多线路互备，稳定访问电影等媒体资源。">
  <meta name="theme-color" content="#06070a">
  <meta property="og:title" content="MediaHub 防丢失媒体分享网站">
  <meta property="og:description" content="多线路互备，收藏本站防止丢失。">
  <meta property="og:type" content="website">
  <title>MediaHub 防丢失媒体分享网站</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06070a;
      --ink: #f3eee4;
      --mute: #8a8478;
      --gold: #c9a227;
      --gold-bright: #e8c547;
      --teal: #4a7d8c;
      --line: rgba(243, 238, 228, 0.14);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      font-family: "Noto Sans SC", sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 5vw, 3rem);
      position: relative;
      overflow-x: hidden;
    }

    /* Stage atmosphere */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 45% at 50% -5%, rgba(201, 162, 39, 0.2), transparent 58%),
        radial-gradient(ellipse 40% 35% at 100% 80%, rgba(74, 125, 140, 0.22), transparent 55%),
        radial-gradient(ellipse 35% 30% at 0% 70%, rgba(120, 48, 36, 0.18), transparent 50%),
        linear-gradient(180deg, #0d1016 0%, var(--bg) 55%, #050608 100%);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: -10%;
      background:
        conic-gradient(from 210deg at 50% 30%, transparent 0deg, rgba(201, 162, 39, 0.06) 40deg, transparent 90deg),
        conic-gradient(from 40deg at 70% 60%, transparent 0deg, rgba(74, 125, 140, 0.05) 50deg, transparent 110deg);
      animation: drift 22s ease-in-out infinite alternate;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.45;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    /* Film sprocket rails */
    .rails {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.12;
    }

    .rails span {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 18px;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0 10px,
        rgba(243, 238, 228, 0.9) 10px 18px,
        transparent 18px 28px
      );
    }

    .rails span:first-child { left: clamp(0.4rem, 2vw, 1.25rem); }
    .rails span:last-child { right: clamp(0.4rem, 2vw, 1.25rem); }

    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to { transform: translate3d(2%, 1.5%, 0) scale(1.04); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes draw {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(420px, 100%);
      text-align: center;
    }

    .brand {
      font-family: Syne, "Noto Sans SC", sans-serif;
      font-weight: 800;
      font-size: clamp(3.2rem, 12vw, 4.6rem);
      letter-spacing: -0.045em;
      line-height: 0.92;
      margin-bottom: 0.85rem;
      animation: rise 0.9s var(--ease) both;
    }

    .brand em {
      font-style: normal;
      background: linear-gradient(115deg, var(--ink) 28%, var(--gold-bright) 78%, var(--ink) 100%);
      background-size: 160% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rise 0.9s var(--ease) both, sheen 8s ease-in-out infinite alternate;
    }

    @keyframes sheen {
      from { background-position: 0% 50%; }
      to { background-position: 100% 50%; }
    }

    .rule {
      width: 3.5rem;
      height: 1px;
      margin: 0 auto 1.1rem;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      transform-origin: center;
      animation: draw 0.8s var(--ease) 0.25s both;
    }

    .tagline {
      font-size: 0.95rem;
      letter-spacing: 0.22em;
      color: var(--mute);
      margin-bottom: 0.85rem;
      animation: rise 0.9s var(--ease) 0.12s both;
    }

    .lede {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--mute);
      margin-bottom: 2.1rem;
      animation: rise 0.9s var(--ease) 0.2s both;
    }

    .routes {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      list-style: none;
      animation: rise 0.9s var(--ease) 0.3s both;
    }

    .routes a {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 1.15rem 1.2rem;
      text-decoration: none;
      color: var(--ink);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.025);
      isolation: isolate;
      overflow: hidden;
      transition: border-color 0.35s var(--ease), transform 0.35s var(--ease), background 0.35s var(--ease);
    }

    .routes a::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 20%, rgba(201, 162, 39, 0.1) 50%, transparent 80%);
      transform: translateX(-120%);
      transition: transform 0.55s var(--ease);
      z-index: -1;
    }

    .routes a:hover,
    .routes a:focus-visible {
      border-color: rgba(201, 162, 39, 0.55);
      background: rgba(201, 162, 39, 0.06);
      transform: translateY(-3px);
      outline: none;
    }

    .routes a:hover::before,
    .routes a:focus-visible::before {
      transform: translateX(120%);
    }

    .routes a:active { transform: translateY(-1px); }

    .route-copy {
      text-align: left;
      min-width: 0;
    }

    .route-name {
      font-family: Syne, "Noto Sans SC", sans-serif;
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
    }

    .route-meta {
      font-size: 0.76rem;
      color: var(--mute);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-go {
      font-family: Syne, sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--gold-bright);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: gap 0.35s var(--ease);
    }

    .routes a:hover .route-go,
    .routes a:focus-visible .route-go {
      gap: 0.55rem;
    }

    .route-go svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    .primary {
      border-color: rgba(201, 162, 39, 0.35);
      background: rgba(201, 162, 39, 0.07);
    }

    .actions {
      margin-top: 1.75rem;
      animation: rise 0.9s var(--ease) 0.4s both;
    }

    .actions button {
      font-family: inherit;
      font-size: 0.84rem;
      color: var(--mute);
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      cursor: pointer;
      padding: 0.15rem 0;
      transition: color 0.25s, border-color 0.25s;
    }

    .actions button:hover,
    .actions button:focus-visible {
      color: var(--gold-bright);
      border-bottom-color: rgba(201, 162, 39, 0.7);
      outline: none;
    }

    footer {
      margin-top: 2.75rem;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      color: rgba(138, 132, 120, 0.7);
      animation: rise 0.9s var(--ease) 0.48s both;
    }

    @media (max-width: 480px) {
      body {
        place-items: start center;
        padding-top: 14vh;
      }

      .rails { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true"></div>
  <div class="rails" aria-hidden="true"><span></span><span></span></div>

  <main class="shell">
    <h1 class="brand"><em>MediaHub</em></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tagline">防丢失媒体分享网站</p>
    <p class="lede">多线路互备，收藏本站即可随时回来。任选一条线路进入电影站。</p>

    <ul class="routes" aria-label="访问线路">
      <li>
        <a class="primary" href="http://117.72.146.0/movies" target="_blank" rel="noopener noreferrer">
          <span class="route-copy">
            <span class="route-name">电影站 · 主线路</span>
            <span class="route-meta">117.72.146.0</span>
          </span>
          <span class="route-go">
            进入
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </li>
      <li>
        <a href="http://45.113.3.26/movies" target="_blank" rel="noopener noreferrer">
          <span class="route-copy">
            <span class="route-name">电影站 · 备用线路</span>
            <span class="route-meta">45.113.3.26</span>
          </span>
          <span class="route-go">
            进入
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </li>
    </ul>

    <div class="actions">
      <button type="button" id="bookmark-btn">收藏本站，防止丢失</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 MediaHub</p>
  </footer>

  <script>
    document.getElementById("bookmark-btn").addEventListener("click", function () {
      var isMac = /Mac|iPhone|iPad|iPod/i.test(navigator.platform || navigator.userAgent);
      var tip = isMac
        ? "请按 ⌘ + D 将本页加入收藏夹"
        : "请按 Ctrl + D 将本页加入收藏夹";

      if (window.sidebar && typeof window.sidebar.addPanel === "function") {
        window.sidebar.addPanel(document.title, window.location.href, "");
        return;
      }
      if (window.external && "AddFavorite" in window.external) {
        try {
          window.external.AddFavorite(location.href, document.title);
          return;
        } catch (e) { /* fall through */ }
      }
      alert(tip);
    });
  </script>
</body>
</html>
