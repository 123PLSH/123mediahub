<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MediaHub 防丢失媒体分享网站 · 马卡龙明亮配色">
  <meta name="theme-color" content="#fcf8f0">
  <meta property="og:title" content="MediaHub 防丢失媒体分享网站">
  <meta property="og:description" content="多线路互备，收藏本站防止丢失。">
  <title>MediaHub · 马卡龙明亮版</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ～ 马卡龙调色盘 ～ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-soft: #fcf8f0;          /* 奶油白 */
      --bg-card: #ffffffcc;
      --ink-primary: #3d3a4a;       /* 柔和深灰紫 */
      --ink-secondary: #6b687a;
      --mute-light: #a6a2b5;
      --macaroon-pink: #fbc4c4;     /* 樱花粉 */
      --macaroon-peach: #fcd5b5;    /* 蜜桃 */
      --macaroon-mint: #b8e0d2;     /* 薄荷 */
      --macaroon-lavender: #d4c9e6; /* 薰衣草 */
      --macaroon-yellow: #f7e3af;   /* 香槟黄 */
      --gold-soft: #d8b87c;         /* 柔和金 */
      --gold-bright: #e6c384;
      --shadow-macaroon: 0 12px 28px -8px rgba(150, 130, 160, 0.18);
      --radius-card: 28px;
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.23, 1, 0.32, 1);
    }

    html, body {
      min-height: 100%;
      background: var(--bg-soft);
    }

    body {
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      color: var(--ink-primary);
      display: grid;
      place-items: center;
      padding: clamp(1.2rem, 4vw, 2.8rem);
      position: relative;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 70% 40% at 20% 20%, #fce9e6 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 70%, #e3f0ed 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 40% 90%, #f5e9f0 0%, transparent 50%),
        var(--bg-soft);
      background-attachment: fixed;
    }

    /* —— 柔和装饰颗粒 —— */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.20;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.35'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    /* —— 胶片齿孔 (淡彩) —— */
    .rails {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.08;
    }

    .rails span {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 18px;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 12px,
        var(--ink-primary) 12px 20px,
        transparent 20px 32px
      );
    }

    .rails span:first-child { left: clamp(0.5rem, 2vw, 1.5rem); }
    .rails span:last-child { right: clamp(0.5rem, 2vw, 1.5rem); }

    /* —— 主容器 —— */
    .shell {
      position: relative;
      z-index: 2;
      width: min(460px, 100%);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(2px);
    }

    /* —— 品牌 (马卡龙渐变) —— */
    .brand {
      font-family: "Syne", "Noto Sans SC", sans-serif;
      font-weight: 800;
      font-size: clamp(3.6rem, 13vw, 5.2rem);
      letter-spacing: -0.03em;
      line-height: 0.92;
      margin-bottom: 0.5rem;
      animation: floatIn 0.7s var(--ease-bounce) both;
      filter: drop-shadow(0 4px 12px rgba(200, 170, 200, 0.15));
    }

    .brand em {
      font-style: normal;
      background: linear-gradient(145deg, #f6b8b8 0%, #f7d4b0 30%, #d8e3c5 60%, #c8d4e8 85%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: macaroonShimmer 8s ease-in-out infinite alternate;
    }

    @keyframes macaroonShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* —— 装饰线 (马卡龙彩色) —— */
    .rule {
      width: 5.6rem;
      height: 3px;
      margin: 0 auto 0.8rem;
      background: linear-gradient(90deg, var(--macaroon-pink), var(--macaroon-yellow), var(--macaroon-mint), var(--macaroon-lavender));
      background-size: 250% 100%;
      border-radius: 20px;
      opacity: 0.6;
      animation: drawGlow 0.8s var(--ease-smooth) 0.2s both, rainbowSlide 6s ease-in-out infinite alternate;
    }

    @keyframes drawGlow {
      0% { transform: scaleX(0); opacity: 0; }
      100% { transform: scaleX(1); opacity: 0.6; }
    }

    @keyframes rainbowSlide {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* —— 副标题 —— */
    .tagline {
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--ink-secondary);
      font-weight: 500;
      margin-bottom: 0.2rem;
      animation: fadeUp 0.7s var(--ease-smooth) 0.15s both;
    }

    .lede {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--ink-secondary);
      max-width: 80%;
      margin: 0 auto 2rem;
      font-weight: 400;
      animation: fadeUp 0.7s var(--ease-smooth) 0.25s both;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* —— 线路卡片 (马卡龙玻璃质感) —— */
    .routes {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      list-style: none;
      animation: fadeUp 0.7s var(--ease-smooth) 0.35s both;
    }

    .routes a {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 0.8rem;
      padding: 1.2rem 1.5rem;
      text-decoration: none;
      color: var(--ink-primary);
      background: var(--bg-card);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-macaroon), 0 1px 0 rgba(255, 255, 255, 0.6) inset;
      transition: all 0.4s var(--ease-bounce);
      isolation: isolate;
      overflow: hidden;
      transform: translateY(0);
    }

    /* 柔和光晕扫过 */
    .routes a::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255, 245, 225, 0.6) 50%, transparent 70%);
      transform: translateX(-150%);
      transition: transform 0.7s var(--ease-smooth);
      z-index: -1;
      border-radius: var(--radius-card);
    }

    .routes a:hover::before,
    .routes a:focus-visible::before {
      transform: translateX(150%);
    }

    /* 彩色描边光晕 */
    .routes a::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: var(--radius-card);
      padding: 2px;
      background: conic-gradient(from 150deg at 50% 50%, var(--macaroon-pink), var(--macaroon-yellow), var(--macaroon-mint), var(--macaroon-lavender), var(--macaroon-pink));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .routes a:hover::after,
    .routes a:focus-visible::after {
      opacity: 0.7;
    }

    .routes a:hover,
    .routes a:focus-visible {
      transform: translateY(-5px) scale(1.01);
      border-color: rgba(255, 215, 180, 0.5);
      background: rgba(255, 248, 240, 0.9);
      box-shadow: 0 20px 40px -12px rgba(180, 150, 170, 0.25), 0 0 0 1px rgba(255, 200, 170, 0.2);
      outline: none;
    }

    .routes a:active {
      transform: translateY(-1px) scale(0.99);
    }

    /* 主线路 (马卡龙高亮) */
    .primary {
      background: linear-gradient(145deg, #fff5ed, #fffcf5);
      border-color: rgba(255, 200, 170, 0.5);
      box-shadow: 0 8px 24px -8px rgba(250, 180, 160, 0.25), var(--shadow-macaroon);
    }

    .primary .route-name {
      color: #b57a6a;
    }

    .primary .route-name::before {
      color: #f5b8a8;
    }

    .route-copy {
      text-align: left;
      min-width: 0;
    }

    .route-name {
      font-family: "Syne", "Noto Sans SC", sans-serif;
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: -0.01em;
      margin-bottom: 0.1rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--ink-primary);
    }

    .route-name::before {
      content: "✦";
      font-size: 0.7rem;
      color: var(--gold-soft);
      opacity: 0.7;
      margin-right: 0.15rem;
    }

    .route-meta {
      font-size: 0.7rem;
      color: var(--mute-light);
      letter-spacing: 0.04em;
      font-weight: 450;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }

    .route-meta::before {
      content: "·";
      color: var(--gold-soft);
      font-weight: 700;
      font-size: 0.9rem;
      opacity: 0.6;
    }

    .route-go {
      font-family: "Syne", sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #b58a7a;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.2rem 0.6rem 0.2rem 0.8rem;
      border-radius: 40px;
      background: rgba(245, 200, 180, 0.15);
      border: 1px solid rgba(245, 200, 180, 0.2);
      transition: all 0.4s var(--ease-bounce);
      white-space: nowrap;
    }

    .routes a:hover .route-go,
    .routes a:focus-visible .route-go {
      gap: 0.6rem;
      background: rgba(245, 200, 180, 0.25);
      border-color: rgba(245, 180, 160, 0.4);
      color: #a57766;
      box-shadow: 0 4px 12px rgba(245, 180, 160, 0.1);
    }

    .route-go svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      transition: transform 0.3s var(--ease-bounce);
    }

    .routes a:hover .route-go svg {
      transform: translateX(4px);
    }

    /* —— 收藏按钮 (马卡龙风) —— */
    .actions {
      margin-top: 2.2rem;
      animation: fadeUp 0.7s var(--ease-smooth) 0.5s both;
    }

    .actions button {
      font-family: "Noto Sans SC", sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--ink-secondary);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.2rem 0.3rem;
      cursor: pointer;
      transition: all 0.3s var(--ease-smooth);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .actions button::before {
      content: "♡";
      font-size: 1.1rem;
      color: var(--macaroon-pink);
      transition: transform 0.3s var(--ease-bounce);
    }

    .actions button:hover,
    .actions button:focus-visible {
      color: var(--ink-primary);
      border-bottom-color: var(--macaroon-pink);
      outline: none;
      transform: translateY(-2px);
    }

    .actions button:hover::before {
      transform: scale(1.2);
    }

    /* —— 页脚 —— */
    footer {
      margin-top: 2.8rem;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--mute-light);
      border-top: 1px solid rgba(100, 80, 100, 0.08);
      padding-top: 1.4rem;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.7s var(--ease-smooth) 0.6s both;
    }

    /* —— 响应式 —— */
    @media (max-width: 480px) {
      body {
        place-items: start center;
        padding: 2rem 1rem;
        padding-top: 8vh;
      }

      .rails { display: none; }

      .lede {
        max-width: 92%;
        font-size: 0.92rem;
      }

      .routes a {
        padding: 1rem 1.2rem;
        border-radius: 22px;
      }

      .route-name {
        font-size: 0.98rem;
      }

      .route-go {
        font-size: 0.6rem;
        padding: 0.1rem 0.4rem 0.1rem 0.6rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        transform: none !important;
      }
      body::before { opacity: 0.08; }
    }

    /* 光标跟随柔光 (装饰) */
    .shell::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 215, 200, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: all 0.1s;
    }
  </style>
</head>
<body>
  <div class="rails" aria-hidden="true"><span></span><span></span></div>

  <main class="shell">
    <h1 class="brand"><em>MediaHub</em></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tagline">♡ 防丢失 · 多线路互备</p>
    <p class="lede">任选一条线路进入电影站，收藏本站随时回来。</p>

    <ul class="routes" aria-label="访问线路">
      <li>
        <a class="primary" href="http://117.72.146.0/movies" target="_blank" rel="noopener noreferrer">
          <span class="route-copy">
            <span class="route-name">主线路 · 电影站</span>
            <span class="route-meta">117.72.146.0</span>
          </span>
          <span class="route-go">
            进入
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </li>
      <li>
        <a href="http://45.113.3.26/movies" target="_blank" rel="noopener noreferrer">
          <span class="route-copy">
            <span class="route-name">备用线路 · 电影站</span>
            <span class="route-meta">45.113.3.26</span>
          </span>
          <span class="route-go">
            进入
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </li>
    </ul>

    <div class="actions">
      <button type="button" id="bookmark-btn">收藏本站，防止丢失</button>
    </div>

    <footer>
      <p>&copy; 2026 MediaHub · 马卡龙版</p>
    </footer>
  </main>

  <script>
    (function() {
      const btn = document.getElementById("bookmark-btn");
      if (!btn) return;

      const isMac = /Mac|iPhone|iPad|iPod/i.test(navigator.platform || navigator.userAgent);
      const tip = isMac
        ? "请按 ⌘ + D 将本页加入收藏夹"
        : "请按 Ctrl + D 将本页加入收藏夹";

      btn.addEventListener("click", function(e) {
        e.preventDefault();

        if (window.sidebar && typeof window.sidebar.addPanel === "function") {
          window.sidebar.addPanel(document.title, window.location.href, "");
          return;
        }
        if (window.external && "AddFavorite" in window.external) {
          try {
            window.external.AddFavorite(location.href, document.title);
            return;
          } catch (_) { /* fall through */ }
        }
        alert(tip);
      });

      btn.addEventListener("focus", function() {
        this.style.borderBottomColor = "#fbc4c4";
      });
      btn.addEventListener("blur", function() {
        this.style.borderBottomColor = "transparent";
      });
    })();
  </script>
</body>
</html>
