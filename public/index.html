<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MediaHub 防丢失媒体分享网站 · 明亮简约">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="MediaHub 防丢失媒体分享网站">
  <meta property="og:description" content="多线路互备，收藏本站防止丢失。">
  <title>MediaHub · 123云盘媒体站</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ～ 明亮简约调色盘 ～ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-pure: #ffffff;
      --bg-soft: #f9fafb;
      --bg-card: #ffffff;
      --ink-primary: #1f2937;
      --ink-secondary: #6b7280;
      --mute-light: #9ca3af;
      /* 明亮高光色 */
      --accent-blue: #3b82f6;
      --accent-blue-soft: #dbeafe;
      --accent-green: #10b981;
      --accent-green-soft: #d1fae5;
      --accent-amber: #f59e0b;
      --accent-amber-soft: #fef3c7;
      --accent-rose: #f43f5e;
      --accent-rose-soft: #ffe4e6;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 12px 28px -6px rgba(0, 0, 0, 0.08), 0 4px 8px -2px rgba(0, 0, 0, 0.04);
      --radius-card: 20px;
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.23, 1, 0.32, 1);
    }

    html, body {
      min-height: 100%;
      background: var(--bg-soft);
    }

    body {
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      color: var(--ink-primary);
      display: grid;
      place-items: center;
      padding: clamp(1.2rem, 4vw, 2.8rem);
      position: relative;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #eff6ff 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 90% 90%, #ecfdf5 0%, transparent 60%),
        var(--bg-soft);
      background-attachment: fixed;
    }

    /* —— 极简柔和光晕 —— */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    /* —— 主容器 —— */
    .shell {
      position: relative;
      z-index: 2;
      width: min(460px, 100%);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* —— 品牌 (明亮渐变) —— */
    .brand {
      font-family: "Syne", "Noto Sans SC", sans-serif;
      font-weight: 800;
      font-size: clamp(3.6rem, 13vw, 5.2rem);
      letter-spacing: -0.03em;
      line-height: 0.92;
      margin-bottom: 0.5rem;
      animation: floatIn 0.7s var(--ease-bounce) both;
      filter: drop-shadow(0 4px 12px rgba(59, 130, 246, 0.1));
    }

    .brand em {
      font-style: normal;
      background: linear-gradient(135deg, #3b82f6 0%, #10b981 50%, #f59e0b 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 8s ease-in-out infinite alternate;
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(16px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* —— 装饰线 (三色明亮) —— */
    .rule {
      width: 5rem;
      height: 3px;
      margin: 0 auto 0.8rem;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-green), var(--accent-amber));
      background-size: 250% 100%;
      border-radius: 20px;
      opacity: 0.8;
      animation: drawGlow 0.8s var(--ease-smooth) 0.2s both, slide 6s ease-in-out infinite alternate;
    }

    @keyframes drawGlow {
      0% { transform: scaleX(0); opacity: 0; }
      100% { transform: scaleX(1); opacity: 0.8; }
    }

    @keyframes slide {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* —— 副标题 —— */
    .tagline {
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--ink-secondary);
      font-weight: 500;
      margin-bottom: 0.2rem;
      animation: fadeUp 0.7s var(--ease-smooth) 0.15s both;
    }

    .lede {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--ink-secondary);
      max-width: 80%;
      margin: 0 auto 2rem;
      font-weight: 400;
      animation: fadeUp 0.7s var(--ease-smooth) 0.25s both;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* —— 线路卡片 (明亮简约) —— */
    .routes {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      list-style: none;
      animation: fadeUp 0.7s var(--ease-smooth) 0.35s both;
    }

    .routes a {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 0.8rem;
      padding: 1.3rem 1.6rem;
      text-decoration: none;
      color: var(--ink-primary);
      background: var(--bg-card);
      border: 1px solid #e5e7eb;
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-sm);
      transition: all 0.35s var(--ease-bounce);
      isolation: isolate;
      overflow: hidden;
      transform: translateY(0);
    }

    .routes a:hover,
    .routes a:focus-visible {
      transform: translateY(-4px) scale(1.01);
      border-color: #bfdbfe;
      box-shadow: var(--shadow-lg), 0 0 0 3px rgba(59, 130, 246, 0.08);
      outline: none;
    }

    .routes a:active {
      transform: translateY(-1px) scale(0.99);
    }

    /* 主线路 (明亮蓝调) */
    .primary {
      background: linear-gradient(145deg, #f0f7ff, #ffffff);
      border-color: #bfdbfe;
      box-shadow: 0 4px 16px -4px rgba(59, 130, 246, 0.15), var(--shadow-sm);
    }

    .primary .route-name {
      color: #2563eb;
    }

    .primary .route-name::before {
      color: #60a5fa;
    }

    .route-copy {
      text-align: left;
      min-width: 0;
    }

    .route-name {
      font-family: "Syne", "Noto Sans SC", sans-serif;
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: -0.01em;
      margin-bottom: 0.1rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--ink-primary);
    }

    .route-name::before {
      content: "◆";
      font-size: 0.6rem;
      color: var(--accent-blue);
      opacity: 0.7;
      margin-right: 0.15rem;
    }

    .route-meta {
      font-size: 0.7rem;
      color: var(--mute-light);
      letter-spacing: 0.04em;
      font-weight: 450;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }

    .route-meta::before {
      content: "·";
      color: var(--mute-light);
      font-weight: 700;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .route-go {
      font-family: "Syne", sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #3b82f6;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.25rem 0.7rem 0.25rem 0.9rem;
      border-radius: 40px;
      background: var(--accent-blue-soft);
      border: 1px solid #bfdbfe;
      transition: all 0.35s var(--ease-bounce);
      white-space: nowrap;
    }

    .routes a:hover .route-go,
    .routes a:focus-visible .route-go {
      gap: 0.7rem;
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1d4ed8;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.12);
    }

    .route-go svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      transition: transform 0.3s var(--ease-bounce);
    }

    .routes a:hover .route-go svg {
      transform: translateX(4px);
    }

    /* 备用线路微调 (绿色点缀) */
    .routes li:nth-child(2) .route-name::before {
      color: var(--accent-green);
    }

    .routes li:nth-child(2) .route-go {
      color: #10b981;
      background: var(--accent-green-soft);
      border-color: #a7f3d0;
    }

    .routes li:nth-child(2) a:hover .route-go {
      background: #d1fae5;
      border-color: #6ee7b7;
      color: #047857;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.12);
    }

    /* —— 收藏按钮 (明亮简约) —— */
    .actions {
      margin-top: 2.2rem;
      animation: fadeUp 0.7s var(--ease-smooth) 0.5s both;
    }

    .actions button {
      font-family: "Noto Sans SC", sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--ink-secondary);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.2rem 0.3rem;
      cursor: pointer;
      transition: all 0.3s var(--ease-smooth);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .actions button::before {
      content: "♡";
      font-size: 1.1rem;
      color: var(--accent-rose);
      transition: transform 0.3s var(--ease-bounce);
    }

    .actions button:hover,
    .actions button:focus-visible {
      color: var(--ink-primary);
      border-bottom-color: var(--accent-rose);
      outline: none;
      transform: translateY(-2px);
    }

    .actions button:hover::before {
      transform: scale(1.2);
    }

    /* —— 页脚 —— */
    footer {
      margin-top: 2.8rem;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--mute-light);
      border-top: 1px solid #f3f4f6;
      padding-top: 1.4rem;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.7s var(--ease-smooth) 0.6s both;
    }

    /* —— 响应式 —— */
    @media (max-width: 480px) {
      body {
        place-items: start center;
        padding: 2rem 1rem;
        padding-top: 8vh;
      }

      .lede {
        max-width: 92%;
        font-size: 0.92rem;
      }

      .routes a {
        padding: 1.1rem 1.3rem;
        border-radius: 16px;
      }

      .route-name {
        font-size: 1rem;
      }

      .route-go {
        font-size: 0.6rem;
        padding: 0.15rem 0.5rem 0.15rem 0.7rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        transform: none !important;
      }
      body::before { opacity: 0.15; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1 class="brand"><em>MediaHub</em></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tagline">♡ 防丢失 · 多线路互备</p>
    <p class="lede">任选一条线路进入电影站，收藏本站随时回来。</p>

    <ul class="routes" aria-label="访问线路">
      <!-- 主线路：45.113.3.26 -->
      <li>
        <a class="primary" href="http://45.113.3.26/movies" target="_blank" rel="noopener noreferrer">
          <span class="route-copy">
            <span class="route-name">主线路 · 电影站</span>
            <span class="route-meta">45.113.3.26</span>
          </span>
          <span class="route-go">
            进入
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </li>
      <!-- 备用线路：同一个 IP，但为了保持两条线路的视觉结构，这里作为备用显示 -->
      <li>
        <a href="http://45.113.3.26/movies" target="_blank" rel="noopener noreferrer">
          <span class="route-copy">
            <span class="route-name">备用线路 · 电影站</span>
            <span class="route-meta">45.113.3.26</span>
          </span>
          <span class="route-go">
            进入
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </li>
    </ul>

    <div class="actions">
      <button type="button" id="bookmark-btn">收藏本站，防止丢失</button>
    </div>

    <footer>
      <p>&copy; 2026 MediaHub · 明亮简约版</p>
    </footer>
  </main>

  <script>
    (function() {
      const btn = document.getElementById("bookmark-btn");
      if (!btn) return;

      const isMac = /Mac|iPhone|iPad|iPod/i.test(navigator.platform || navigator.userAgent);
      const tip = isMac
        ? "请按 ⌘ + D 将本页加入收藏夹"
        : "请按 Ctrl + D 将本页加入收藏夹";

      btn.addEventListener("click", function(e) {
        e.preventDefault();

        if (window.sidebar && typeof window.sidebar.addPanel === "function") {
          window.sidebar.addPanel(document.title, window.location.href, "");
          return;
        }
        if (window.external && "AddFavorite" in window.external) {
          try {
            window.external.AddFavorite(location.href, document.title);
            return;
          } catch (_) { /* fall through */ }
        }
        alert(tip);
      });

      btn.addEventListener("focus", function() {
        this.style.borderBottomColor = "#f43f5e";
      });
      btn.addEventListener("blur", function() {
        this.style.borderBottomColor = "transparent";
      });
    })();
  </script>
</body>
</html>
